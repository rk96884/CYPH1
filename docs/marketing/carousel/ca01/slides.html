<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>CA-01 · Meet the four phases</title>
<style>

*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{background:#21132b;color:#f7f3f8;font-family:Manrope,Arial,sans-serif}.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:#21132b}.slide:before,.slide:after{content:"";position:absolute;border:2px solid #5a376d;border-radius:50%;width:600px;height:600px;right:-260px;top:-290px;opacity:.55}.slide:after{width:460px;height:460px;right:-190px;top:-225px;opacity:.4}.top{position:absolute;top:70px;left:84px;right:84px;display:flex;align-items:center;justify-content:space-between;z-index:2}.series{font-size:20px;letter-spacing:.18em;color:#d9c6f2}.logo{width:230px}.rule{position:absolute;top:178px;left:84px;right:84px;height:1px;background:#7a6589}.body{position:absolute;left:84px;right:84px;top:270px}.index{color:#e6c685;font-size:22px;letter-spacing:.16em;text-transform:uppercase}.headline{font:400 65px/1.23 Michroma,Arial,sans-serif;letter-spacing:-.025em;text-transform:uppercase;margin:34px 0 0}.accent{color:#b990fa}.sub{font-size:30px;line-height:1.45;color:#d9c6f2;max-width:750px;margin-top:48px}.phase-title{font:400 76px/1.18 Michroma,Arial,sans-serif;margin-top:24px}.phase-label{font:400 38px/1.3 Michroma,Arial,sans-serif;color:#b990fa;margin-top:30px}.phase-art{position:absolute;left:145px;top:540px;width:790px;height:562px}.phase-art svg{width:100%;height:100%}.bottom{position:absolute;bottom:78px;left:84px;right:84px;display:flex;align-items:end;justify-content:space-between;color:#d9c6f2;font-size:19px;letter-spacing:.15em;text-transform:uppercase}.bottom .stroke{width:86px;height:3px;background:#a77af4}.bottom .number{color:#e6c685}.intro-ring{position:absolute;left:230px;top:630px;width:620px;height:620px;border:2px solid #a77af4;border-radius:50%;opacity:.65}.intro-ring:before,.intro-ring:after{content:"";position:absolute;border:1px solid #e6c685;border-radius:50%;inset:80px;opacity:.5}.intro-ring:after{inset:155px}.intro-ring span{position:absolute;inset:240px;text-align:center;font:400 80px/1.6 Michroma;color:#e6c685}.final-logo{width:720px;margin-top:170px}.descriptor{font:400 32px/1.35 Michroma;color:#d9c6f2;margin-top:55px}.cta-rule{width:100%;height:2px;background:#a77af4;margin-top:85px}.cta{font:400 52px/1.3 Michroma;margin-top:44px}.url{font-size:29px;color:#b990fa;margin-top:30px}.fine{font-size:21px;color:#d9c6f2;line-height:1.4;margin-top:46px}
</style></head><body><main id="slide" class="slide"><div class="top"><span class="series">KNOW THE CYCLE</span><img class="logo" src="../../../../public/brand/generated/cyph1-wordmark-clean-metallic.svg" alt="CYPH/1"></div><div class="rule"></div><div id="content"></div><div class="bottom"><div class="stroke"></div><span class="number" id="slide-number"></span></div></main>
<script>
const phases=[
{name:'ANAGEN',label:'ACTIVE GROWTH',bottom:92,bulb:91,top:8,papilla:97,detached:false},
{name:'CATAGEN',label:'TRANSITION',bottom:78,bulb:76,top:12,papilla:93,detached:false},
{name:'TELOGEN',label:'REST',bottom:65,bulb:63,top:10,papilla:90,detached:false},
{name:'EXOGEN',label:'RELEASE AND SHEDDING',bottom:70,bulb:68,top:-8,papilla:94,detached:true}
];
function illustration(p){const start=p.detached?40:p.bulb;return `<svg viewBox="0 0 180 128" role="img" aria-label="Illustrative ${p.name.toLowerCase()} follicle"><defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5a376d"/><stop offset="1" stop-color="#281733"/></linearGradient><linearGradient id="hair" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9b6a35"/><stop offset="1" stop-color="#e6c685"/></linearGradient></defs><path fill="url(#skin)" stroke="#9f78b4" stroke-width=".5" d="M14 40 Q28 29 47 34 Q66 39 90 34 Q114 29 133 34 Q152 39 166 40 L166 93 Q162 116 139 120 L41 120 Q18 116 14 93 Z"/><path fill="none" stroke="#d9c6f2" stroke-width=".7" d="M15 41 Q30 31 48 36 Q67 41 90 36 Q113 31 132 36 Q150 41 165 41"/><path fill="none" stroke="#b990fa" stroke-width="1.3" d="M82 39 C76 54 73 ${p.bottom-13} 77 ${p.bottom} C80 ${p.bottom+9} 94 ${p.bottom+9} 98 ${p.bottom} C102 ${p.bottom-13} 99 54 94 39"/><path fill="url(#hair)" d="M86 ${start} C85 57 91 24 111 ${p.top} C96 29 90 58 91 ${start} Z"/><ellipse fill="#e6c685" cx="88" cy="${p.bulb}" rx="${p.name==='ANAGEN'?9:6}" ry="${p.name==='ANAGEN'?8:5}"/><path fill="none" stroke="#a77af4" stroke-width="1.2" d="M76 51 C65 43 58 49 60 56 C65 55 71 56 77 61"/><path fill="none" stroke="#a77af4" stroke-width="1" d="M37 108 C48 94 57 102 67 90 M143 108 C132 94 122 102 110 90"/><path fill="none" stroke="#f7f3f8" stroke-width="1" d="M84 ${p.papilla+4} Q88 ${p.papilla-5} 92 ${p.papilla+4}"/>${p.detached?'<path fill="none" stroke="#e6c685" stroke-width="1.2" d="M116 12 Q126 6 135 4"/>':''}<line x1="24" x2="156" y1="121" y2="121" stroke="#a77af4" stroke-width=".6"/></svg>`}
const n=Math.max(1,Math.min(6,Number(new URLSearchParams(location.search).get('slide')||1)));
document.getElementById('slide-number').textContent=`${String(n).padStart(2,'0')} / 06`;
const content=document.getElementById('content');
if(n===1)content.innerHTML='<div class="body"><div class="index">A four-part guide</div><h1 class="headline">HAIR GROWS<br>IN <span class="accent">CYCLES.</span></h1><p class="sub">The hair-growth cycle is commonly described in four stages.</p></div><div class="intro-ring"><span>04</span></div>';
else if(n<=5){const p=phases[n-2];content.innerHTML=`<div class="body"><div class="index">${String(n-1).padStart(2,'0')} / FOUR STAGES</div><h1 class="phase-title">${p.name}</h1><div class="phase-label">${p.label}</div></div><div class="phase-art">${illustration(p)}</div>`}
else content.innerHTML='<div class="body"><div class="index">The cycle continues</div><h1 class="headline">KNOW THE <span class="accent">CYCLE.</span></h1><img class="final-logo" src="../../../../public/brand/generated/cyph1-wordmark-clean-metallic.svg" alt="CYPH/1"><div class="descriptor">CYCLE. PHASE. ONE.</div><div class="cta-rule"></div><div class="cta">READ THE FULL GUIDE</div><div class="url">CYPH1.CO.UK/LEARN/HAIR-GROWTH-CYCLE/</div><div class="fine">General hair-cycle education. No future-product claim.</div></div>';
</script></body></html>
