name: Development R2 restore rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_BACKUP_ENDPOINT }}
      R2_BUCKET: cyph1-commerce-backups
      SOURCE_DATABASE_URL: ${{ secrets.COMMERCE_DEVELOPMENT_DATABASE_URL }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL"
          test -n "$BACKUP_AGE_IDENTITY"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          case "$R2_ENDPOINT" in
            https://*.eu.r2.cloudflarestorage.com) ;;
            *) echo "R2 endpoint must be the EU jurisdiction S3 API endpoint."; exit 1 ;;
          esac

      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates age >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17 postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Download newest encrypted development backup
        shell: bash
        run: |
          set -euo pipefail
          object="$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "development/" --endpoint-url "$R2_ENDPOINT" --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)"
          test -n "$object"
          test "$object" != "None"
          case "$object" in *.dump.age) ;; *) echo "Newest development object is not an encrypted dump."; exit 1 ;; esac
          aws s3 cp "s3://$R2_BUCKET/$object" "$RUNNER_TEMP/backup.dump.age" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          test -s "$RUNNER_TEMP/backup.dump.age"
          echo "Downloaded newest encrypted development backup."

      - name: Decrypt and validate PostgreSQL dump
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$RUNNER_TEMP/identity.txt"
          unset BACKUP_AGE_IDENTITY
          age -d -i "$RUNNER_TEMP/identity.txt" -o "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/backup.dump.age"
          test -s "$RUNNER_TEMP/backup.dump"
          test "$(head -c 5 "$RUNNER_TEMP/backup.dump")" = "PGDMP"
          echo "Encrypted backup decrypted and PostgreSQL custom-format header verified."

      - name: Create isolated PostgreSQL restore target
        shell: bash
        run: |
          set -euo pipefail
          sudo pg_ctlcluster 17 main start || true
          sudo -u postgres createdb commerce_restore_test
          echo "RESTORE_DATABASE_URL=postgresql://postgres@localhost:5432/commerce_restore_test" >> "$GITHUB_ENV"

      - name: Restore encrypted backup into isolated target
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres /usr/lib/postgresql/17/bin/pg_restore --exit-on-error --no-owner --no-privileges --dbname=commerce_restore_test "$RUNNER_TEMP/backup.dump"
          echo "Backup restored into isolated runner-local PostgreSQL database."

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Compare isolated restore with development source
        working-directory: apps/commerce-api
        env:
          ALLOW_DATABASE_RESTORE_VERIFICATION: "true"
          DATABASE_RESTORE_VERIFICATION_CONFIRM: restore-rehearsal
          SOURCE_DATABASE_SSL: "true"
          RESTORE_DATABASE_SSL: "false"
        run: npm run db:verify:restore

      - name: Remove restore and runner-local backup material
        if: always()
        shell: bash
        run: |
          sudo -u postgres dropdb --if-exists commerce_restore_test 2>/dev/null || true
          rm -f "$RUNNER_TEMP/backup.dump.age" "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/identity.txt"
