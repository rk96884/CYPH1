name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SIGNUP_API_URL: ${{ vars.PUBLIC_SIGNUP_API_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run commerce unit and integration tests
        run: npm run test:commerce

      - name: Build proposed site
        run: npm run build

      - name: Run accessibility audit
        run: node scripts/audit-accessibility.mjs

      - name: Run performance budget audit
        run: node scripts/audit-performance.mjs

      - name: Run generated-site link audit
        run: node scripts/audit-links.mjs

