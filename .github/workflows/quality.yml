name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SIGNUP_API_URL: ${{ vars.PUBLIC_SIGNUP_API_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run commerce unit and integration tests
        run: npm run test:commerce

      - name: Test staging monitor behaviour
        run: npm run test:staging-monitor

      - name: Audit commerce secret boundaries
        run: npm run audit:commerce-security

      - name: Build proposed site
        run: npm run build

      - name: Run accessibility audit
        run: node scripts/audit-accessibility.mjs

      - name: Run performance budget audit
        run: node scripts/audit-performance.mjs

      - name: Run generated-site link audit
        run: node scripts/audit-links.mjs

      - name: Build private accessibility fixture
        env:
          PUBLIC_COMMERCE_UI_ENABLED: "true"
          PUBLIC_COMMERCE_TEST_PRODUCT_SLUG: integration-test-fixture
          PUBLIC_COMMERCE_TEST_PRODUCT_NAME: INTEGRATION TEST FIXTURE — NOT FOR SALE
          PUBLIC_COMMERCE_API_URL: https://private-api.example
          PUBLIC_COMMERCE_TEST_SHIPPING_RATE_ID: 00000000-0000-0000-0000-000000000000
          PUBLIC_COMMERCE_OPERATIONS_UI_ENABLED: "true"
          PUBLIC_COMMERCE_OPERATIONS_SLUG: operations-test
          PUBLIC_COMMERCE_OPERATIONS_API_URL: https://private-api.example
        run: npm run build

      - name: Audit private commerce accessibility
        run: npm run audit:private-commerce-a11y

