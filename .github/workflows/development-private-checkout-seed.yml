name: Seed development private checkout fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-private-checkout-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Seed private checkout staging fixture
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed private checkout staging fixture
        env:
          DATABASE_URL: ${{ secrets.COMMERCE_DEVELOPMENT_DATABASE_URL }}
        run: npm run db:seed:private-checkout-staging
