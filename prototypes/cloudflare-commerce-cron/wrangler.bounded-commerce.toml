# No Cron, no secrets. Production Hyperdrive is configured but launch-gated.
# Disabled-only bounded Worker. Real tasks wired but uncallable without approvals.
# Do not deploy to production without independent safety/launch authorization.
name = "cyph1-bounded-commerce-disabled"
main = "src/bounded-commerce-worker.mjs"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
[vars]
COMMERCE_BOUNDED_WORKER_ENABLED = "false"
COMMERCE_BOUNDED_OWNER_AUTHORIZED = "false"
COMMERCE_BOUNDED_INTEGRATION_ENABLED = "false"
COMMERCE_LAUNCH_SAFETY_APPROVED = "false"
COMMERCE_HYPERDRIVE_TLS_REVIEWED = "false"
COMMERCE_BOUNDED_COMMUNICATIONS_ENABLED = "false"
COMMERCE_BOUNDED_FULFILMENT_ENABLED = "false"

# Binding is never opened while approval flags remain false.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6853d927cd45484390f49a73ff260022"
